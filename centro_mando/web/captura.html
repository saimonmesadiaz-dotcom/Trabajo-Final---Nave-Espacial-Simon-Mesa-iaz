
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap"
  rel="stylesheet"
>

<style>

body {
  margin: 0;
  background: #05070f;
  color: #00f5ff;
  font-family: Orbitron, sans-serif;
  text-align: center;
}

#o {
  width: 100%;
  max-width: 480px;
  border: 2px solid #00f5ff;
  border-radius: 12px;
}

#mic {
  font: 700 20px Orbitron;
  padding: 18px 30px;
  border-radius: 50px;
  border: 2px solid #ff2bd6;
  background: #1a0b2e;
  color: #ff2bd6;
  cursor: pointer;
}

#txt {
  font-size: 15px;
}

</style>

</head>

<body>

<div id="gest" style="display:none">

  <video
    id="v"
    playsinline
    style="display:none"
  ></video>

  <canvas
    id="o"
    width="480"
    height="360"
  ></canvas>

</div>

<div id="voz" style="display:none">

  <button id="mic">
    🎙️ HABLAR
  </button>

</div>

<p id="txt">Conectando con MQTT...</p>


<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

// ===================================================
// CONFIGURACIÓN
// ===================================================

const Q = new URLSearchParams(location.search);

const P = Q.get("p") || "__PREFIJO__";

const MODO = Q.get("modo") || "__MODO__";

const txt = document.getElementById("txt");

const c = mqtt.connect(
  "wss://broker.hivemq.com:8884/mqtt",
  {
    reconnectPeriod: 2000,
    connectTimeout: 10000,
    clientId: "NaveCaptura_" + Math.random().toString(16).slice(2)
  }
);

let conectado = false;

c.on("connect", () => {

  conectado = true;

  txt.textContent = "Conectado · modo " + MODO;

});

c.on("reconnect", () => {

  conectado = false;

  txt.textContent = "Reconectando MQTT...";

});

c.on("close", () => {

  conectado = false;

  txt.textContent = "Conexión MQTT cerrada";

});

c.on("error", err => {

  console.error("MQTT captura:", err);

});


// ===================================================
// PUBLICAR ENTRADAS
// ===================================================

function publicar(objeto) {

  if (!conectado) {

    txt.textContent = "Sin conexión MQTT. No se envió la orden.";

    return;

  }

  c.publish(
    P + "/entrada",
    JSON.stringify(objeto),
    { qos: 1 },
    err => {

      if (err) {

        txt.textContent = "Error enviando comando";

      }

    }
  );

}


// ===================================================
// MOSTRAR MODO
// ===================================================

if (MODO === "voz") {

  document.getElementById("voz").style.display = "block";

} else if (MODO === "gest") {

  document.getElementById("gest").style.display = "block";

} else {

  txt.textContent = "Modo de captura desconocido";

  throw new Error("Modo inválido: " + MODO);

}


// ===================================================
// RECONOCIMIENTO DE VOZ
// ===================================================

if (MODO === "voz") {

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SR) {

    txt.textContent =
      "Este navegador no admite reconocimiento de voz.";

    throw new Error("SpeechRecognition no disponible");

  }

  const rec = new SR();

  let escuchando = false;

  rec.lang = "es-ES";

  rec.continuous = true;

  rec.interimResults = false;

  rec.onresult = e => {

    const resultado =
      e.results[e.results.length - 1];

    const texto =
      resultado[0].transcript.trim();

    txt.textContent = "Escuché: " + texto;

    publicar({
      tipo: "voz",
      texto: texto
    });

  };

  rec.onerror = e => {

    txt.textContent =
      "Error de voz: " + e.error;

    if (e.error !== "no-speech") {

      escuchando = false;

      document.getElementById("mic").textContent =
        "🎙️ HABLAR";

    }

  };

  rec.onend = () => {

    if (escuchando) {

      try {

        rec.start();

      } catch (e) {

        console.log("Reconocimiento reiniciándose");

      }

    }

  };

  document.getElementById("mic").onclick = () => {

    escuchando = !escuchando;

    if (escuchando) {

      try {

        rec.start();

        document.getElementById("mic").textContent =
          "🔴 ESCUCHANDO";

        txt.textContent = "Escuchando órdenes...";

      } catch (e) {

        escuchando = false;

        txt.textContent =
          "No se pudo iniciar el micrófono";

      }

    } else {

      rec.stop();

      document.getElementById("mic").textContent =
        "🎙️ HABLAR";

      txt.textContent = "Micrófono detenido";

    }

  };

}


// ===================================================
// RECONOCIMIENTO DE GESTOS
// ===================================================

if (MODO === "gest") {

  const video = document.getElementById("v");

  const canvas = document.getElementById("o");

  const ctx = canvas.getContext("2d");

  const distancia = (a, b) => {

    return Math.hypot(
      a.x - b.x,
      a.y - b.y
    );

  };

  const hands = new Hands({

    locateFile: file =>
      "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file

  });

  hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 0,

    minDetectionConfidence: 0.7,

    minTrackingConfidence: 0.6

  });

  let ultimo = "";

  let desde = 0;

  let enviado = "";

  hands.onResults(r => {

    ctx.clearRect(0, 0, 480, 360);

    ctx.drawImage(
      r.image,
      0,
      0,
      480,
      360
    );

    if (!r.multiHandLandmarks.length) {

      ultimo = "";

      enviado = "";

      return;

    }

    const L = r.multiHandLandmarks[0];

    drawConnectors(
      ctx,
      L,
      HAND_CONNECTIONS,
      { color: "#00f5ff" }
    );

    drawLandmarks(
      ctx,
      L,
      {
        color: "#ff2bd6",
        radius: 2
      }
    );

    const w = L[0];

    const ext = [

      Number(
        distancia(L[4], L[17]) >
        distancia(L[3], L[17])
      ),

      ...[
        [8, 6],
        [12, 10],
        [16, 14],
        [20, 18]
      ].map(([t, p]) =>

        Number(
          distancia(L[t], w) >
          distancia(L[p], w)
        )

      )

    ];

    const k = ext.join("");

    let gesto;
    let valor;

    // Pulgar extendido
    if (k === "10000") {

      gesto = "escudos";

    }

    // Índice y meñique extendidos
    else if (k === "01001") {

      gesto = "despegue";

    }

    // Mano abierta
    else if (k === "11111") {

      gesto = "compuerta";

    }

    // Otros gestos: velocidad de motores
    else {

      gesto = "motores";

      valor = 25 * (
        ext[1] +
        ext[2] +
        ext[3] +
        ext[4]
      );

    }

    const clave = gesto + (valor ?? "");

    if (clave !== ultimo) {

      ultimo = clave;

      desde = performance.now();

    }

    else if (
      performance.now() - desde > 600 &&
      clave !== enviado
    ) {

      enviado = clave;

      publicar({

        tipo: "gesto",

        gesto: gesto,

        valor: valor

      });

      txt.textContent =
        "Gesto detectado: " +
        gesto +
        (valor !== undefined ? " " + valor + "%" : "");

    }

  });


  // Iniciar cámara
  const camara = new Camera(video, {

    onFrame: async () => {

      await hands.send({
        image: video
      });

    },

    width: 480,

    height: 360

  });

  camara.start().catch(err => {

    txt.textContent =
      "No se pudo iniciar la cámara: " + err;

  });

}

</script>

</body>
</html>
