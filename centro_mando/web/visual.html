<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
<canvas id="c" style="width:100%;border-radius:14px;border:1px solid #00f5ff55"></canvas>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script>
const P="__PREFIJO__", cv=document.getElementById("c"), g=cv.getContext("2d"); cv.width=900; cv.height=420;
let T={temp:0,combustible:0,distancia:0,emergencia:false,escudos:false,meteoritos:false,compuerta:0,motores:0,alerta:false,mision:"PLATAFORMA",motivo:""};
const c=mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
c.on("connect",()=>c.subscribe(P+"/telemetria"));
c.on("message",(t,m)=>{try{Object.assign(T,JSON.parse(m))}catch(e){}});
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*420/r.height;
  if(x>700&&x<880&&y>350&&y<400)c.publish(P+"/comandos",JSON.stringify({alerta:!T.alerta}));};
const stars=[...Array(120)].map(()=>({x:Math.random()*900,y:Math.random()*420,s:Math.random()*2+.5}));
let met=[],ry=0,fr=0;
function loop(){fr++;
  g.fillStyle="#05070f";g.fillRect(0,0,900,420);
  stars.forEach(s=>{g.fillStyle=`rgba(255,255,255,${.3+.7*Math.abs(Math.sin(fr/40+s.x))})`;g.fillRect(s.x,s.y,s.s,s.s)});
  if(T.meteoritos){ if(fr%12==0){const x=Math.random()*900;met.push({x,y:-20,vx:(450-x)/90,vy:340/90});} } else met=[];
  met=met.filter(m=>m.y<330);
  met.forEach(m=>{m.x+=m.vx;m.y+=m.vy;g.strokeStyle="#ff8a00";g.lineWidth=4;g.beginPath();g.moveTo(m.x,m.y);g.lineTo(m.x-m.vx*6,m.y-m.vy*6);g.stroke();
    g.fillStyle="#ffb347";g.beginPath();g.arc(m.x,m.y,9,0,7);g.fill();});
  ry=T.mision=="EN VUELO"?Math.min(ry+3,250):Math.max(ry-6,0);
  const x=450,y=330-ry;
  if(T.motores>0){g.fillStyle="#ff8a00";g.beginPath();g.moveTo(x-12,y+40);g.lineTo(x+12,y+40);g.lineTo(x,y+40+T.motores*.5+Math.random()*10);g.fill();}
  g.fillStyle="#dfe9ff";g.fillRect(x-18,y-30,36,70);g.beginPath();g.moveTo(x-18,y-30);g.lineTo(x,y-70);g.lineTo(x+18,y-30);g.fill();
  g.fillStyle="#ff2bd6";g.fillRect(x-30,y+20,14,24);g.fillRect(x+16,y+20,14,24);
  g.fillStyle=T.compuerta>0?"#000":"#00f5ff";g.fillRect(x-8,y-5,16,26);
  if(T.escudos){g.save();g.shadowColor="#00f5ff";g.shadowBlur=30;g.strokeStyle="#00f5ff";g.lineWidth=6;
    g.strokeRect(4,4,892,412);g.lineWidth=3;g.beginPath();g.ellipse(x,y,90,110,0,0,7);g.stroke();g.restore();}
  g.font="16px Orbitron, monospace";
  g.fillStyle=T.temp>30?"#ff3b3b":"#00f5ff";g.fillText("REACTOR "+Number(T.temp).toFixed(1)+" C",20,30);
  g.fillStyle=T.combustible<30?"#ffd400":"#00f5ff";g.fillText("COMBUSTIBLE "+T.combustible+"%",20,56);
  g.fillStyle="#00f5ff";g.fillText("RADAR "+T.distancia+" cm",20,82);
  g.fillStyle="#ff2bd6";g.textAlign="right";g.fillText("MISION: "+T.mision,880,30);
  if(T.motivo){g.fillStyle="#ffd400";g.fillText(T.motivo,880,56);} g.textAlign="left";
  g.fillStyle=(T.alerta&&Math.floor(fr/15)%2==0)?"#ff1f3d":"#3a0a14";g.fillRect(700,350,180,50);
  g.fillStyle="#fff";g.fillText("ALERTA",745,382);
  requestAnimationFrame(loop);}
loop();
</script>
