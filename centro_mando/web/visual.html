
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap"
  rel="stylesheet"
>

<style>
body {
  margin: 0;
  background: #05070f;
}

canvas {
  width: 100%;
  display: block;
  border-radius: 14px;
  border: 1px solid #00f5ff55;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>

<script>

const P = "__PREFIJO__";

const cv = document.getElementById("c");
const g = cv.getContext("2d");

cv.width = 900;
cv.height = 420;

let T = {
  temp: 0,
  combustible: 0,
  distancia: 0,
  emergencia: false,
  escudos: false,
  meteoritos: false,
  compuerta: 0,
  motores: 0,
  alerta: false,
  mision: "PLATAFORMA",
  motivo: ""
};

let conectado = false;

const c = mqtt.connect(
  "wss://broker.hivemq.com:8884/mqtt",
  {
    reconnectPeriod: 2000,
    connectTimeout: 10000,
    clientId: "NaveVisual_" + Math.random().toString(16).slice(2)
  }
);

c.on("connect", () => {

  conectado = true;

  c.subscribe(P + "/telemetria");

});

c.on("reconnect", () => {
  conectado = false;
});

c.on("close", () => {
  conectado = false;
});

c.on("error", err => {
  console.error("MQTT visual:", err);
});

c.on("message", (topic, mensaje) => {

  try {

    const d = JSON.parse(
      new TextDecoder().decode(mensaje)
    );

    Object.assign(T, d);

    // Compatibilidad con nombres del ESP32
    if (d.comb !== undefined) {
      T.combustible = d.comb;
    }

    if (d.dist !== undefined) {
      T.distancia = d.dist;
    }

    if (d.emerg !== undefined) {
      T.emergencia = d.emerg;
    }

    if (d.vuelo !== undefined && d.mision === undefined) {
      T.mision = d.vuelo ? "EN VUELO" : "PLATAFORMA";
    }

    if (d.alerta === undefined) {
      T.alerta = Boolean(
        d.alertaMan || T.meteoritos || T.emergencia
      );
    }

  } catch (e) {

    console.error("Error de telemetría:", e);

  }

});


// ===================================================
// ESTRELLAS
// ===================================================

const stars = [...Array(120)].map(() => ({
  x: Math.random() * 900,
  y: Math.random() * 420,
  s: Math.random() * 2 + 0.5
}));

let meteoritos = [];
let ry = 0;
let fr = 0;


// ===================================================
// BOTÓN DE ALERTA MANUAL
// ===================================================

cv.onclick = e => {

  const r = cv.getBoundingClientRect();

  const x = (e.clientX - r.left) * 900 / r.width;
  const y = (e.clientY - r.top) * 420 / r.height;

  if (
    x > 700 &&
    x < 880 &&
    y > 350 &&
    y < 400
  ) {

    if (conectado) {

      c.publish(
        P + "/comandos",
        JSON.stringify({
          alerta: !Boolean(T.alerta)
        }),
        { qos: 1 }
      );

    }

  }

};


// ===================================================
// DIBUJO DE LA NAVE
// ===================================================

function dibujarNave(x, y) {

  // Propulsor
  if (Number(T.motores) > 0) {

    g.fillStyle = "#ff8a00";

    g.beginPath();

    g.moveTo(x - 12, y + 40);
    g.lineTo(x + 12, y + 40);

    g.lineTo(
      x,
      y + 40 + Number(T.motores) * 0.5 + Math.random() * 10
    );

    g.fill();

  }

  // Cuerpo
  g.fillStyle = "#dfe9ff";

  g.fillRect(x - 18, y - 30, 36, 70);

  g.beginPath();

  g.moveTo(x - 18, y - 30);
  g.lineTo(x, y - 70);
  g.lineTo(x + 18, y - 30);

  g.fill();

  // Alas
  g.fillStyle = "#ff2bd6";

  g.fillRect(x - 30, y + 20, 14, 24);
  g.fillRect(x + 16, y + 20, 14, 24);

  // Ventana
  g.fillStyle = Number(T.compuerta) > 0
    ? "#000"
    : "#00f5ff";

  g.fillRect(x - 8, y - 5, 16, 26);

}


// ===================================================
// ESCUDOS
// ===================================================

function dibujarEscudos(x, y) {

  if (!T.escudos) return;

  g.save();

  g.shadowColor = "#00f5ff";
  g.shadowBlur = 30;

  g.strokeStyle = "#00f5ff";
  g.lineWidth = 6;

  g.strokeRect(4, 4, 892, 412);

  g.lineWidth = 3;

  g.beginPath();

  g.ellipse(x, y, 90, 110, 0, 0, Math.PI * 2);

  g.stroke();

  g.restore();

}


// ===================================================
// METEORITOS
// ===================================================

function dibujarMeteoritos() {

  if (T.meteoritos) {

    if (fr % 12 === 0) {

      const x = Math.random() * 900;

      meteoritos.push({
        x,
        y: -20,
        vx: (450 - x) / 90,
        vy: 340 / 90
      });

    }

  } else {

    meteoritos = [];

  }

  meteoritos = meteoritos.filter(
    m => m.y < 330
  );

  meteoritos.forEach(m => {

    m.x += m.vx;
    m.y += m.vy;

    g.strokeStyle = "#ff8a00";
    g.lineWidth = 4;

    g.beginPath();

    g.moveTo(m.x, m.y);

    g.lineTo(
      m.x - m.vx * 6,
      m.y - m.vy * 6
    );

    g.stroke();

    g.fillStyle = "#ffb347";

    g.beginPath();

    g.arc(m.x, m.y, 9, 0, Math.PI * 2);

    g.fill();

  });

}


// ===================================================
// INFORMACIÓN
// ===================================================

function escribirInformacion() {

  g.font = "16px Orbitron, monospace";

  g.textAlign = "left";

  g.fillStyle = Number(T.temp) > 30
    ? "#ff3b3b"
    : "#00f5ff";

  g.fillText(
    "REACTOR " + Number(T.temp || 0).toFixed(1) + " C",
    20,
    30
  );

  g.fillStyle = Number(T.combustible) < 30
    ? "#ffd400"
    : "#00f5ff";

  g.fillText(
    "COMBUSTIBLE " + (T.combustible ?? 0) + "%",
    20,
    56
  );

  g.fillStyle = "#00f5ff";

  g.fillText(
    "RADAR " + (T.distancia ?? 0) + " cm",
    20,
    82
  );

  g.textAlign = "right";

  g.fillStyle = "#ff2bd6";

  g.fillText(
    "MISION: " + T.mision,
    880,
    30
  );

  if (T.motivo) {

    g.fillStyle = "#ffd400";

    g.fillText(
      String(T.motivo),
      880,
      56
    );

  }

  g.textAlign = "left";

}


// ===================================================
// INDICADOR DE ALERTA
// ===================================================

function dibujarAlerta() {

  const activa = Boolean(T.alerta);

  g.fillStyle = (
    activa && Math.floor(fr / 15) % 2 === 0
  )
    ? "#ff1f3d"
    : "#3a0a14";

  g.fillRect(700, 350, 180, 50);

  g.fillStyle = "#fff";

  g.font = "16px Orbitron, monospace";

  g.fillText(
    activa ? "ALERTA ACTIVA" : "ALERTA",
    715,
    382
  );

}


// ===================================================
// ANIMACIÓN PRINCIPAL
// ===================================================

function loop() {

  fr++;

  g.fillStyle = "#05070f";

  g.fillRect(0, 0, 900, 420);

  // Estrellas
  stars.forEach(s => {

    g.fillStyle =
      `rgba(255,255,255,${0.3 + 0.7 * Math.abs(Math.sin(fr / 40 + s.x))})`;

    g.fillRect(s.x, s.y, s.s, s.s);

  });

  // Meteoritos
  dibujarMeteoritos();

  // Movimiento de nave
  ry = T.mision === "EN VUELO"
    ? Math.min(ry + 3, 250)
    : Math.max(ry - 6, 0);

  const x = 450;
  const y = 330 - ry;

  dibujarNave(x, y);

  dibujarEscudos(x, y);

  escribirInformacion();

  dibujarAlerta();

  // Estado MQTT
  g.fillStyle = conectado ? "#00ff88" : "#ff3b3b";

  g.font = "12px Orbitron, monospace";

  g.fillText(
    conectado ? "MQTT ONLINE" : "MQTT OFFLINE",
    20,
    400
  );

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
