<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<canvas id="c" style="width:100%;border-radius:18px;display:block"></canvas>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script>
const P="__PREFIJO__",V="__VISTA__",cv=document.getElementById("c"),g=cv.getContext("2d"),W=900,H=440;cv.width=W;cv.height=H;
let T={temp:0,combustible:0,distancia:0,emergencia:false,escudos:false,meteoritos:false,compuerta:0,motores:0,alerta:false,mision:"PLATAFORMA",motivo:""};
const c=mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
c.on("connect",()=>c.subscribe(P+"/telemetria"));
c.on("message",(t,m)=>{try{Object.assign(T,JSON.parse(m))}catch(e){}});
const stars=[...Array(150)].map(()=>({a:Math.random()*6.28,d:Math.random()*300,s:Math.random()*1.8+.4}));
let met=[],fr=0,shake=0,flash=0;
const blink=()=>Math.floor(fr/14)%2==0, X=W/2, Y=H/2+5;
const chip=(x,y,txt,col)=>{g.font="600 12px Orbitron";const w=g.measureText(txt).width+24;g.fillStyle=col+"22";g.strokeStyle=col;g.lineWidth=1.5;
  g.beginPath();g.roundRect(x,y,w,26,13);g.fill();g.stroke();g.fillStyle=col;g.textAlign="left";g.fillText(txt,x+12,y+17);return w+10;};
function banner(txt,col,on){g.fillStyle=on?col+"cc":col+"33";g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.roundRect(120,12,660,40,20);g.fill();g.stroke();
  g.fillStyle="#fff";g.font="800 17px Orbitron";g.textAlign="center";g.fillText(txt,X,38);}

function ventana(){
  g.save();g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;
  g.fillStyle="#080c1a";g.fillRect(-20,-20,W+40,H+40);
  g.beginPath();g.roundRect(120,64,660,316,56);g.save();g.clip();
  const bg=g.createRadialGradient(X,Y,20,X,Y,380);bg.addColorStop(0,"#13093a");bg.addColorStop(1,"#02030a");g.fillStyle=bg;g.fillRect(100,50,700,350);
  stars.forEach(s=>{s.d+=.35+s.d*.004;if(s.d>420)s.d=2;const x=X+Math.cos(s.a)*s.d*1.7,y=Y+Math.sin(s.a)*s.d*.9;g.fillStyle=`rgba(255,255,255,${Math.min(1,s.d/120)})`;g.fillRect(x,y,s.s,s.s)});
  if(T.meteoritos){ if(fr%38==0)met.push({a:Math.random()*6.28,d:8,k:Math.random()*.6+.7}); } else met=[];
  met=met.filter(m=>{m.d+=1.2+m.d*.03;if(m.d>270){shake=16;flash=1;return false}return true});
  met.forEach(m=>{const x=X+Math.cos(m.a)*m.d*1.6,y=Y+Math.sin(m.a)*m.d*.9,r=(4+m.d*.24)*m.k;
    g.strokeStyle="rgba(255,140,0,.5)";g.lineWidth=r*.6;g.beginPath();g.moveTo(x,y);g.lineTo(X+Math.cos(m.a)*(m.d-30)*1.6,Y+Math.sin(m.a)*(m.d-30)*.9);g.stroke();
    const gr=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);gr.addColorStop(0,"#ffcf8a");gr.addColorStop(.6,"#a4572a");gr.addColorStop(1,"#3a1a0c");
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle="rgba(0,0,0,.3)";g.beginPath();g.arc(x+r*.3,y+r*.2,r*.22,0,7);g.arc(x-r*.35,y+r*.3,r*.15,0,7);g.fill();});
  if(T.meteoritos){const v=g.createRadialGradient(X,Y,150,X,Y,400);v.addColorStop(0,"rgba(255,0,40,0)");v.addColorStop(1,`rgba(255,0,40,${blink()?.45:.2})`);g.fillStyle=v;g.fillRect(100,50,700,350);}
  if(T.escudos){const s=g.createLinearGradient(0,60+(fr*3)%330,0,120+(fr*3)%330);g.fillStyle="rgba(0,245,255,.10)";g.fillRect(100,50,700,350);
    g.fillStyle="rgba(0,245,255,.18)";g.fillRect(100,60+(fr*3)%330,700,14);
    g.strokeStyle="rgba(0,245,255,.25)";g.lineWidth=1;for(let i=0;i<9;i++){g.beginPath();g.ellipse(X,Y,60+i*50,40+i*28,0,0,7);g.stroke();}}
  if(flash>0){g.fillStyle=`rgba(255,60,60,${flash*.5})`;g.fillRect(100,50,700,350);flash-=.06;}
  g.restore();
  g.lineWidth=18;g.strokeStyle="#2d3556";g.beginPath();g.roundRect(120,64,660,316,56);g.stroke();
  g.lineWidth=3;g.strokeStyle=T.escudos?"#00f5ff":(T.meteoritos?"#ff3b5c":"#4a86a8");
  if(T.escudos){g.shadowColor="#00f5ff";g.shadowBlur=26}g.beginPath();g.roundRect(111,55,678,334,62);g.stroke();g.shadowBlur=0;
  g.fillStyle="#56628f";[[138,82],[762,82],[138,362],[762,362]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],5,0,7);g.fill()});
  if(T.meteoritos)banner("⚠ ¡METEORITOS EN RUTA! · ACTIVA LOS ESCUDOS","#ff1f3d",blink());
  else if(T.escudos)banner("🛡 ESCUDOS ACTIVOS · SECTOR PROTEGIDO","#00c8d6",true);
  else banner("✔ SECTOR DESPEJADO · ESCUDOS LISTOS","#1fbf75",false);
  if(T.meteoritos){g.fillStyle="#ffd400";g.font="600 14px Orbitron";g.textAlign="center";g.fillText("Di «activar escudos» o haz el gesto 👍",X,404);}
  let x=120,y=410;
  x+=chip(x,y,"REACTOR "+Number(T.temp).toFixed(1)+" °C",T.temp>30?"#ff3b3b":"#00f5ff");
  x+=chip(x,y,"COMBUSTIBLE "+T.combustible+"%",T.combustible<30?"#ffd400":"#00f5ff");
  x+=chip(x,y,"COMPUERTA "+(T.compuerta>0?"ABIERTA":"CERRADA"),"#b48cff");
  chip(x,y,T.mision,"#ff2bd6");
  g.restore();
}

function gauge(x,y,r,v,max,label,unit,col){
  g.lineCap="round";g.lineWidth=14;g.strokeStyle="#1b2240";g.beginPath();g.arc(x,y,r,Math.PI*.8,Math.PI*2.2);g.stroke();
  g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=14;g.beginPath();g.arc(x,y,r,Math.PI*.8,Math.PI*.8+Math.PI*1.4*Math.min(Math.max(v/max,0),1));g.stroke();g.shadowBlur=0;
  g.fillStyle="#e8fbff";g.font="800 24px Orbitron";g.textAlign="center";g.fillText(Math.round(v)+unit,x,y+8);
  g.font="600 12px Orbitron";g.fillStyle="#7fa6c8";g.fillText(label,x,y+r+34);}
function maquinas(){
  const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#070b1c");bg.addColorStop(1,"#1a0b2e");g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(0,245,255,.07)";g.lineWidth=1;for(let i=0;i<W;i+=40){g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke()}for(let i=0;i<H;i+=40){g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke()}
  g.fillStyle="#00f5ff";g.font="800 18px Orbitron";g.textAlign="left";g.fillText("SALA DE MÁQUINAS · INSTRUMENTOS",30,38);
  gauge(130,190,72,T.temp,60,"REACTOR","°",T.temp>30?"#ff3b3b":"#00f5ff");
  gauge(330,190,72,T.combustible,100,"COMBUSTIBLE","%",T.combustible<30?"#ffd400":"#39ff14");
  gauge(530,190,72,T.motores,100,"MOTORES","%","#ff2bd6");
  g.fillStyle="#9fb6d8";g.font="600 13px Orbitron";g.textAlign="left";g.fillText("COMPUERTA",30,350);
  g.fillStyle="#1b2240";g.beginPath();g.roundRect(30,360,500,18,9);g.fill();
  g.fillStyle="#b48cff";g.beginPath();g.roundRect(30,360,Math.max(18,500*Math.min(T.compuerta,90)/90),18,9);g.fill();
  g.fillStyle="#fff";g.font="600 12px Orbitron";g.fillText(T.compuerta>0?"ABIERTA ("+T.compuerta+"°)":"CERRADA",36,374);
  g.fillStyle="#ff2bd6";g.font="800 20px Orbitron";g.fillText("MISIÓN: "+T.mision,30,412);
  if(T.motivo){g.fillStyle="#ffd400";g.font="600 14px Orbitron";g.fillText(T.motivo,330,412);}
  g.fillStyle="rgba(10,14,34,.8)";g.strokeStyle="#00f5ff55";g.lineWidth=1.5;g.beginPath();g.roundRect(640,60,240,330,16);g.fill();g.stroke();
  g.fillStyle="#00f5ff";g.font="800 14px Orbitron";g.textAlign="left";g.fillText("ALERTAS",662,92);
  [["METEORITOS",T.meteoritos],["REACTOR > 30 °C",T.temp>30],["COMBUSTIBLE BAJO",T.combustible<30],["EMERGENCIA",T.emergencia],["ALERTA ACTIVA",T.alerta],["ESCUDOS ACTIVOS",T.escudos,"#00f5ff"]]
   .forEach((a,i)=>{const on=a[1],col=a[2]||"#ff3b3b",y=130+i*40;
     g.fillStyle=on?(blink()||a[2]?col:"#551018"):"#26304f";g.beginPath();g.arc(670,y-5,7,0,7);g.fill();
     g.fillStyle=on?"#fff":"#6b7aa6";g.font="600 13px Orbitron";g.fillText(a[0],688,y);});
  const y=330-(T.mision=="EN VUELO"?60:0);
  if(T.motores>0){g.fillStyle="#ff8a00";g.beginPath();g.moveTo(748,y+26);g.lineTo(762,y+26);g.lineTo(755,y+26+T.motores*.3+Math.random()*8);g.fill();}
  g.fillStyle="#dfe9ff";g.fillRect(745,y-14,20,40);g.beginPath();g.moveTo(745,y-14);g.lineTo(755,y-34);g.lineTo(765,y-14);g.fill();
}
function loop(){fr++;V=="maquinas"?maquinas():ventana();requestAnimationFrame(loop)}loop();
</script>
